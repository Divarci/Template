# CI — api build + test gate.
# Runs on every pull request on a Microsoft-hosted agent; never deploys (CD lives in azure-pipelines-ci-cd.yml).
trigger: none

pr:
  branches:
    include:
      - "*"

variables:
  buildConfiguration: 'Release'
  solution: 'Template.slnx'
  # Must match the application's net10.0 target (docs/deployment/guidelines/tech-stack.md).
  dotnetSdkVersion: '10.0.x'
  # Outside the source tree; Agent.TempDirectory is cleaned after every job.
  testResultsDirectory: '$(Agent.TempDirectory)/TestResults'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: BuildAndTest
    displayName: 'Build and test api'
    jobs:
      - job: BuildAndTestJob
        displayName: 'Restore, build, test Template.slnx'
        steps:

          # ── 1. Install .NET SDK ──────────────────────────────────────────────
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'
              includePreviewVersions: true

          # ── 2. Restore ───────────────────────────────────────────────────────
          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          # ── 3. Build ─────────────────────────────────────────────────────────
          - task: DotNetCoreCLI@2
            displayName: 'Build ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # ── 4. Test ──────────────────────────────────────────────────────────
          # VSTest mode (test projects set IsTestingPlatformApplication=false; no global.json).
          # Results are published by the explicit step below, so the task's own publishing is off.
          - task: DotNetCoreCLI@2
            displayName: 'Test ($(buildConfiguration))'
            inputs:
              command: 'test'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(testResultsDirectory)"'
              publishTestResults: false

          # ── 5. Publish test results ──────────────────────────────────────────
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()   # Always runs — results are published even when tests fail
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(testResultsDirectory)'
              mergeTestResults: true
              testRunTitle: 'api tests'
