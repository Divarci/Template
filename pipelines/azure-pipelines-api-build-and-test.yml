# CI — api build gate.
# Runs on every pull request on a Microsoft-hosted agent; never deploys (CD lives in azure-pipelines-ci-cd.yml).
trigger: none

pr:
  branches:
    include:
      - "*"

variables:
  buildConfiguration: 'Release'
  solution: 'Template.slnx'
  # Must match the application's net10.0 target (docs/deployment/guidelines/tech-stack.md).
  dotnetSdkVersion: '10.0.x'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: 'Build api'
    jobs:
      - job: BuildJob
        displayName: 'Restore and build Template.slnx'
        steps:

          # ── 1. Install .NET SDK ──────────────────────────────────────────────
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'
              includePreviewVersions: true

          # ── 2. Restore ───────────────────────────────────────────────────────
          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          # ── 3. Build ─────────────────────────────────────────────────────────
          - task: DotNetCoreCLI@2
            displayName: 'Build ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'
